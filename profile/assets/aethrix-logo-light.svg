<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 50 156 156" width="256" height="256">
  <!-- Aethrix Lab company mark — the prism (see aethrix-logo-dark.svg for the rationale
       and the userSpaceOnUse note; the beam is a vertical line and must not use the
       objectBoundingBox gradient default). Light palette. -->
  <defs>
    <linearGradient id="logo-beam-light" gradientUnits="userSpaceOnUse" x1="64" y1="9" x2="64" y2="122">
      <stop offset="0%"   stop-color="#00cec9"/>
      <stop offset="55%"  stop-color="#00a8a4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3d35b0" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g transform="translate(45.63,43.72) scale(1.287)">
    <polygon points="64,9 109,42 64,53 19,42" fill="#7c72f0"/>
    <polygon points="64,53 109,42 109,82 64,93" fill="#5b4de8"/>
    <polygon points="64,93 109,82 64,122 19,82" fill="#3d35b0"/>
    <polygon points="19,42 64,53 64,93 19,82" fill="#7068e0" opacity="0.3"/>
    <line x1="64" y1="9" x2="64" y2="122" stroke="url(#logo-beam-light)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="64" cy="9" r="6" fill="#00cec9" opacity="0.85"/>
    <circle cx="64" cy="122" r="3.9" fill="#00cec9" opacity="0.45"/>
  </g>
</svg>
