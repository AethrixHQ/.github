<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 39 180 180" width="512" height="512">
  <!-- Aethrix Studio product mark, dark palette — copy for the organization profile
       READMEs. Same viewBox fix as the light copy (canonical "50 50 156 156" leaves the
       apex node 2.9 units and the spine's bottom cap 0.7 units from the edges, which
       reads as clipped at README sizes). Geometry and palette identical to
       engineering/technical/client/branding/studio-logo-dark.svg. -->
  <defs>
    <linearGradient id="studio-spine-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00fff5"/>
      <stop offset="55%"  stop-color="#00d4d0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5b4de8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Bottom layer — Simulation / Load -->
  <path d="M120.51,120.69 Q128,115.7 135.49,120.69 L182.51,152.01 Q190,157 182.51,161.99 L135.49,193.31 Q128,198.3 120.51,193.31 L73.49,161.99 Q66,157 73.49,152.01 Z" fill="#5b4de8"/>
  <!-- Mid layer — Automation -->
  <path d="M120.51,97.69 Q128,92.7 135.49,97.69 L182.51,129.01 Q190,134 182.51,138.99 L135.49,170.31 Q128,175.3 120.51,170.31 L73.49,138.99 Q66,134 73.49,129.01 Z" fill="#887fe6"/>
  <!-- Top layer — Manual Testing -->
  <path d="M120.51,74.69 Q128,69.7 135.49,74.69 L182.51,106.01 Q190,111 182.51,115.99 L135.49,147.31 Q128,152.3 120.51,147.31 L73.49,115.99 Q66,111 73.49,106.01 Z" fill="#b0a8ff"/>
  <!-- Spine -->
  <rect x="121" y="62.7" width="14" height="142.6" rx="7" fill="url(#studio-spine-dark)"/>
  <!-- Apex node -->
  <circle cx="128" cy="62.7" r="9.8" fill="#00fff5" opacity="0.95"/>
</svg>
